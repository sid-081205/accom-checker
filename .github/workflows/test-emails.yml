name: Send test emails (summary + availability inject)

on:
  workflow_dispatch:
  # Temporary: send a live test email for this PR, then remove after the run.
  push:
    branches:
      - cursor/availability-email-extra-recipients-5fde

permissions:
  contents: read
  actions: read

jobs:
  test-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send daily summary email
        run: npm run summary

      - name: Check Chrome
        run: google-chrome --version

      - name: Run availability detector on injected HTML and send test email
        run: npm run test:availability-inject
        env:
          SEND_TEST_AVAILABILITY_EMAIL: "true"
