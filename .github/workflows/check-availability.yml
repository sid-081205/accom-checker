name: Check LSE accommodation availability

on:
  workflow_dispatch:

permissions:
  contents: write

# Do NOT cancel in-progress runs. MFA/email-code waits need the browser session
# to stay alive; cancelling them every 5 minutes was regenerating a new
# Authenticator number on every cron tick. Auth failures auto-pause the
# checker so queued follow-ups exit immediately instead of starting new logins.
concurrency:
  group: lse-accommodation-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Includes up to ~90s of backoff when LSE serves its Unexpected Error page.
    timeout-minutes: 12

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      HEADLESS: "true"
      SEND_ON_EVERY_HIT: "true"
      MFA_WAIT_MS: "240000"
      LSE_EMAIL: ${{ secrets.LSE_EMAIL }}
      LSE_PASSWORD: ${{ secrets.LSE_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome
        run: google-chrome --version

      - name: Restore previous check state
        uses: actions/cache@v4
        with:
          path: .state
          key: availability-state-${{ github.run_id }}
          restore-keys: |
            availability-state-

      # Cookies only — never restore chrome-profile. Cached profiles across
      # runners were correlated with LSE "An Error has Occurred" pages.
      - name: Restore cached LSE login cookies
        uses: actions/cache/restore@v4
        with:
          path: .auth/lse-cookies.json
          key: lse-cookies-${{ github.run_id }}
          restore-keys: |
            lse-cookies-

      - name: Seed LSE login session from secret
        env:
          LSE_COOKIES_B64: ${{ secrets.LSE_COOKIES_B64 }}
        run: |
          mkdir -p .auth
          rm -rf .auth/chrome-profile
          if [ ! -f .auth/lse-cookies.json ] && [ -n "$LSE_COOKIES_B64" ]; then
            printf "%s" "$LSE_COOKIES_B64" | base64 --decode > .auth/lse-cookies.json
          fi

      - name: Check availability
        run: npm run check

      # Only persist cookies after a successful check. Saving mid-MFA / failed
      # cookies poisons the next restore and forces another Authenticator prompt.
      - name: Save cached LSE login cookies
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .auth/lse-cookies.json
          key: lse-cookies-${{ github.run_id }}
