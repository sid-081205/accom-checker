name: Check LSE accommodation availability

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lse-accommodation-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      HEADLESS: "true"
      SEND_ON_EVERY_HIT: "false"
      MFA_WAIT_MS: "240000"
      LSE_EMAIL: ${{ secrets.LSE_EMAIL }}
      LSE_PASSWORD: ${{ secrets.LSE_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Decide whether to run check
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status_json="$(gh api 'repos/${{ github.repository }}/contents/status.json?ref=status' --jq '.content' 2>/dev/null | base64 --decode || true)"
          checked_at="$(printf "%s" "$status_json" | jq -r '.checkedAt // .updatedAt // empty' 2>/dev/null || true)"

          if [ -z "$checked_at" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_epoch="$(date -d "$checked_at" +%s 2>/dev/null || echo 0)"
          now_epoch="$(date +%s)"
          age_seconds="$((now_epoch - last_epoch))"

          if [ "$age_seconds" -ge 240 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping check; last run was ${age_seconds}s ago."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Check Chrome
        if: steps.gate.outputs.should_run == 'true'
        run: google-chrome --version

      - name: Restore previous check state
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .state
          key: availability-state-${{ github.run_id }}
          restore-keys: |
            availability-state-

      - name: Restore cached LSE login session
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .auth
          key: lse-auth-${{ github.run_id }}
          restore-keys: |
            lse-auth-

      - name: Seed LSE login session from secret
        if: steps.gate.outputs.should_run == 'true'
        env:
          LSE_COOKIES_B64: ${{ secrets.LSE_COOKIES_B64 }}
        run: |
          mkdir -p .auth
          if [ ! -f .auth/lse-cookies.json ] && [ -n "$LSE_COOKIES_B64" ]; then
            printf "%s" "$LSE_COOKIES_B64" | base64 --decode > .auth/lse-cookies.json
          fi

      - name: Check availability
        if: steps.gate.outputs.should_run == 'true'
        run: npm run check

      - name: Save cached LSE login session
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .auth
          key: lse-auth-${{ github.run_id }}
